<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimon RPG - World 3 Ultimate Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0b0f1a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; padding: 8px; }
        header { text-align: center; background: #1e293b; width: 100%; padding: 8px; border-radius: 6px; border: 2px solid #3b82f6; font-size: 14px; }
        .status-panel { display: flex; justify-content: space-between; width: 100%; background: #1e1b4b; padding: 8px; border-radius: 6px; border: 1px solid #60a5fa; font-size: 12px; }
        .game-screen { width: 100%; flex-grow: 1; margin: 6px 0; background: #090d16; border: 2px solid #2563eb; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .location-title { color: #fbbf24; font-weight: bold; font-size: 15px; margin-bottom: 4px; }
        .log-box { background: #020617; border: 1px solid #1e293b; padding: 8px; height: 100px; overflow-y: auto; font-size: 12px; color: #38bdf8; border-radius: 4px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; margin-bottom: 4px; }
        button { background: #2563eb; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 12px; text-transform: uppercase; }
        button:active { background: #1d4ed8; }
        .action-buttons { display: flex; gap: 5px; width: 100%; flex-wrap: wrap; justify-content: center; }
        .action-buttons button { background: #d97706; flex: 1; min-width: 45%; padding: 8px; font-size: 11px; }
    </style>
</head>
<body>

    <header>
        <h2>DIGIMON WORLD 3: ULTIMATE</h2>
    </header>

    <div class="status-panel" id="statusPanel">
        <div>
            <strong id="digiName">Agumon</strong> (<span id="digiStage">Rookie</span>) - Nv.<span id="digiLevel">5</span><br>
            HP: <span id="digiHp">100</span>/<span id="digiMaxHp">100</span> | ATK: <span id="digiAtk">25</span>
        </div>
        <div>
            EXP: <span id="digiExp">0</span>/<span id="digiNextExp">100</span><br>
            Bits: <span id="playerBits">600</span> | Poções: <span id="itemPotions">2</span> | Cartas: <span id="cardCount">1</span>
        </div>
    </div>

    <div class="game-screen">
        <div>
            <div class="location-title" id="locName">Central Park</div>
            <p id="locDesc" style="font-size: 12px; color: #94a3b8; margin-bottom: 6px;">Zona segura com Terminal, Loja e o balcão de Quests.</p>
        </div>
        <div class="log-box" id="gameLog">
            [Sistema] Bem-vindo, Tamer! Explora o mundo, aceita missões, compra poções e evolui o teu parceiro!
        </div>
    </div>

    <div style="width: 100%;">
        <div class="controls" id="navigationControls"></div>
        <div class="action-buttons">
            <button onclick="usePotion()">Usar Poção</button>
            <button onclick="openShop()" style="background: #059669;">Loja</button>
            <button onclick="openQuestBoard()" style="background: #7c3aed;">Quests</button>
            <button onclick="useCard()" style="background: #db2777;">Usar Carta Suporte</button>
            <button onclick="restAtTerminal()" style="background: #10b981; min-width: 100%;">Curar no Terminal</button>
        </div>
    </div>

    <script>
        const playerGame = {
            bits: 600,
            inventory: { potions: 2, cards: 1 },
            quest: { active: null, target: 0, progress: 0, reward: 200, description: "Nenhuma missão ativa." },
            digimon: {
                name: "Agumon",
                stage: "Rookie",
                level: 5,
                hp: 100,
                maxHp: 100,
                atk: 25,
                exp: 0,
                nextLevelExp: 100
            }
        };

        const gameWorld = {
            currentLocation: "Central Park",
            locations: {
                "Central Park": {
                    name: "Central Park (Cidade Inicial)",
                    description: "Zona segura com o Terminal de Servidor, Loja e Quests.",
                    connections: ["South Sector Outskirts", "Digimon Cemetery"],
                    hasWildBattles: false
                },
                "South Sector Outskirts": {
                    name: "Arredores do Sector Sul",
                    description: "Planícies verdes com Goburimons e Kunemons selvagens.",
                    connections: ["Central Park", "Ether Jungle"],
                    hasWildBattles: true,
                    wildMonsters: [
                        { name: "Goburimon", hp: 60, atk: 18, expReward: 40 },
                        { name: "Kunemon", hp: 50, atk: 15, expReward: 35 }
                    ],
                    encounterRate: 0.6
                },
                "Ether Jungle": {
                    name: "Selva Ether",
                    description: "Floresta densa com Digimons de tipo planta.",
                    connections: ["South Sector Outskirts"],
                    hasWildBattles: true,
                    wildMonsters: [
                        { name: "Palmon", hp: 80, atk: 20, expReward: 55 },
                        { name: "Tentomon", hp: 85, atk: 22, expReward: 60 }
                    ],
                    encounterRate: 0.7
                },
                "Digimon Cemetery": {
                    name: "Cemitério de Digimons",
                    description: "Ruínas antigas com Bakemons corrompidos.",
                    connections: ["Central Park"],
                    hasWildBattles: true,
                    wildMonsters: [
                        { name: "Bakemon", hp: 110, atk: 28, expReward: 80 }
                    ],
                    encounterRate: 0.7
                }
            },

            travelTo(destinationName) {
                this.currentLocation = destinationName;
                const loc = this.locations[destinationName];
                logMessage(`🗺️ Viajaste para: ${loc.name}`);
                updateUI();
                updateNavigation();

                if (loc.hasWildBattles && Math.random() < loc.encounterRate) {
                    const wild = loc.wildMonsters[Math.floor(Math.random() * loc.wildMonsters.length)];
                    triggerWildBattle(wild);
                }
            }
        };

        function logMessage(msg) {
            const logBox = document.getElementById("gameLog");
            logBox.innerHTML += `<br>${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            const d = playerGame.digimon;
            document.getElementById("digiName").innerText = d.name;
            document.getElementById("digiStage").innerText = d.stage;
            document.getElementById("digiLevel").innerText = d.level;
            document.getElementById("digiHp").innerText = d.hp;
            document.getElementById("digiMaxHp").innerText = d.maxHp;
            document.getElementById("digiAtk").innerText = d.atk;
            document.getElementById("digiExp").innerText = d.exp;
            document.getElementById("digiNextExp").innerText = d.nextLevelExp;
            document.getElementById("playerBits").innerText = playerGame.bits;
            document.getElementById("itemPotions").innerText = playerGame.inventory.potions;
            document.getElementById("cardCount").innerText = playerGame.inventory.cards;

            const loc = gameWorld.locations[gameWorld.currentLocation];
            document.getElementById("locName").innerText = loc.name;
            document.getElementById("locDesc").innerText = loc.description;
        }

        function updateNavigation() {
            const controlsDiv = document.getElementById("navigationControls");
            controlsDiv.innerHTML = "";
            const loc = gameWorld.locations[gameWorld.currentLocation];

            loc.connections.forEach(dest => {
                const btn = document.createElement("button");
                btn.innerText = `Ir: ${dest}`;
                btn.onclick = () => gameWorld.travelTo(dest);
                controlsDiv.appendChild(btn);
            });
        }

        // Funcionalidade 1: Lojas de Itens
        function openShop() {
            if (gameWorld.currentLocation !== "Central Park") {
                logMessage("❌ Só podes aceder à Loja no Central Park!");
                return;
            }
            if (playerGame.bits >= 150) {
                playerGame.bits -= 150;
                playerGame.inventory.potions++;
                logMessage("🛍️ Compraste 1 Poção por 150 Bits!");
                updateUI();
            } else {
                logMessage("❌ Bits insuficientes para comprar poções (Custo: 150 Bits).");
            }
        }

        // Funcionalidade 2: Sistema de Cartas / Digi-Battles (Suporte)
        function useCard() {
            if (playerGame.inventory.cards > 0) {
                playerGame.inventory.cards--;
                playerGame.digimon.atk += 10;
                logMessage("🎴 Usaste a Carta de Suporte! O Ataque do Digimon aumentou permanentemente em +10.");
                updateUI();
            } else {
                logMessage("❌ Não tens cartas de suporte! Ganhas algumas ao derrotar monstros.");
            }
        }

        // Funcionalidade 3: Quests / Missões Secundárias
        function openQuestBoard() {
            if (gameWorld.currentLocation !== "Central Park") {
                logMessage("❌ O balcão de Quests fica no Central Park!");
                return;
            }
            if (!playerGame.quest.active) {
                playerGame.quest = { active: "Goburimon", target: 2, progress: 0, reward: 250, description: "Derrotar 2 Goburimon nos Arredores." };
                logMessage(`📜 Nova Quest Aceite: ${playerGame.quest.description}`);
            } else {
                logMessage(`📜 Quest Ativa: ${playerGame.quest.description} (${playerGame.quest.progress}/${playerGame.quest.target})`);
            }
        }

        function checkQuestProgress(monsterName) {
            if (playerGame.quest.active === monsterName) {
                playerGame.quest.progress++;
                logMessage(`🎯 Progresso da Quest: ${playerGame.quest.progress}/${playerGame.quest.target}`);
                if (playerGame.quest.progress >= playerGame.quest.target) {
                    playerGame.bits += playerGame.quest.reward;
                    logMessage(`🏆 Quest Concluída! Recebeste ${playerGame.quest.reward} Bits de recompensa!`);
                    playerGame.quest.active = null;
                }
            }
        }

        function triggerWildBattle(wild) {
            logMessage(`⚠️ Um ${wild.name} selvagem apareceu!`);
            let d = playerGame.digimon;

            while (d.hp > 0 && wild.hp > 0) {
                wild.hp -= d.atk;
                if (wild.hp <= 0) break;
                d.hp -= wild.atk;
            }

            if (d.hp > 0) {
                logMessage(`🏆 Vitória contra o ${wild.name}!`);
                playerGame.bits += 50;
                checkQuestProgress(wild.name);
                
                // Chance de dropar carta de suporte
                if (Math.random() < 0.4) {
                    playerGame.inventory.cards++;
                    logMessage(`🎴 Encontraste uma Digi-Carta rara após o combate!`);
                }

                gainExp(wild.expReward);
            } else {
                d.hp = 1;
                logMessage(`💀 O teu Digimon desmaiou! Recuaste para o Central Park.`);
                gameWorld.currentLocation = "Central Park";
            }
            updateUI();
            updateNavigation();
        }

        function gainExp(amount) {
            let d = playerGame.digimon;
            d.exp += amount;
            logMessage(`⭐ Ganhaste ${amount} de EXP.`);

            if (d.exp >= d.nextLevelExp) {
                d.exp -= d.nextLevelExp;
                d.level++;
                d.maxHp += 30;
                d.hp = d.maxHp;
                d.atk += 8;
                logMessage(`🎉 Subiste para o Nível ${d.level}!`);
                checkDigivolution();
            }
        }

        // Funcionalidade 4: Múltiplas Linhas de Evolução Ramificadas
        function checkDigivolution() {
            let d = playerGame.digimon;
            if (d.stage === "Rookie" && d.level >= 8) {
                d.stage = "Champion";
                // Ramificação baseada na força de ataque acumulada
                if (d.atk >= 40) {
                    d.name = "Greymon";
                    d.atk += 20;
                    logMessage(`🔥 EVOLUÇÃO RAMIFICADA! O teu Digimon tornou-se um agressivo Greymon!`);
                } else {
                    d.name = "Meramon";
                    d.maxHp += 50;
                    logMessage(`🔥 EVOLUÇÃO RAMIFICADA! O teu Digimon tornou-se um ardente Meramon!`);
                }
                d.hp = d.maxHp;
            }
        }

        function usePotion() {
            if (playerGame.inventory.potions > 0) {
                playerGame.inventory.potions--;
                playerGame.digimon.hp = Math.min(playerGame.digimon.maxHp, playerGame.digimon.hp + 60);
                logMessage(`🧪 Poção usada com sucesso!`);
                updateUI();
            } else {
                logMessage(`❌ Não tens poções! Vai à Loja no Central Park.`);
            }
        }

        function restAtTerminal() {
            if (gameWorld.currentLocation === "Central Park") {
                playerGame.digimon.hp = playerGame.digimon.maxHp;
                logMessage(`💚 Descansaste no Terminal. Vida a 100%!`);
                updateUI();
            } else {
                logMessage(`❌ Só podes curar no Central Park!`);
            }
        }

        window.onload = () => {
            updateUI();
            updateNavigation();
        };
    </script>
</body>
</html>
